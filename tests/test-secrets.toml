# 브라우저 테스트 전용 Secrets. 가짜 값만 들어 있어 저장소에 올려도 된다.
# 실행: python -m streamlit run app.py --secrets.files tests/test-secrets.toml
# 실제 .streamlit/secrets.toml 대신 이 파일만 읽으므로, 실제 운영자 비밀번호·서비스 계정을 테스트에 쓰지 않는다.

STORAGE = "memory"          # Google Sheets 대신 서버 메모리에 기록 (화면에 테스트 모드 경고)
CONTEST_ID = "dev-테스트"
PIN_SALT = "test-salt"
ADMIN_PASSWORD = "admin-test"

# AI 오답분석: .env의 실제 키가 쓰이지 않도록 아무것도 없는 로컬 포트로 보낸다.
# 호출이 바로 실패해 "오답분석을 불러오지 못했습니다" 안내 경로를 비용 없이 확인한다.
OPENAI_BASE_URL = "http://127.0.0.1:9"
OPENAI_TIMEOUT_SEC = "3"
